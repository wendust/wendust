<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>贪吃蛇 - wendust 示例</title>
<style>html,body{margin:0;height:100%;background:#0D1524;overflow:hidden;touch-action:none}canvas{display:block}#tip{position:fixed;top:10px;left:0;right:0;text-align:center;color:#8FA0BC;font:13px/1.6 system-ui;pointer-events:none}#back{position:fixed;top:10px;left:10px;color:#8FB3E8;text-decoration:none;font:14px system-ui;background:rgba(13,21,36,.7);padding:8px 14px;border-radius:10px;z-index:9}</style></head>
<body><a id="back" href="../index.html#examples">返回</a><div id="tip"></div>
<script>
const c=document.createElement('canvas');document.body.appendChild(c);const x=c.getContext('2d');
const N=22,S=16;let W,H;function R(){W=c.width=Math.min(innerWidth,N*S);H=c.height=Math.min(innerHeight,N*S);c.style.margin='auto'}R();
let sn=[[10,10]],dir=[1,0],food=[5,5],alive=true,score=0,tick=0;
onkeydown=e=>{const k=e.key;if(k==='ArrowUp'&&dir[1]===0)dir=[0,-1];if(k==='ArrowDown'&&dir[1]===0)dir=[0,1];if(k==='ArrowLeft'&&dir[0]===0)dir=[-1,0];if(k==='ArrowRight'&&dir[0]===0)dir=[1,0]};
onpointerdown=e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/S|0,py=(e.clientY-r.top)/S|0,h=sn[0];
if(Math.abs(px-h[0])>Math.abs(py-h[1]))dir=[px>h[0]?1:-1,0];else dir=[0,py>h[1]?1:-1]};
function step(){if(!alive)return;tick++;
const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
if(h[0]<0||h[0]>=N||h[1]<0||h[1]>=N||sn.some(s=>s[0]===h[0]&&s[1]===h[1])){alive=false;return}
sn.unshift(h);
if(h[0]===food[0]&&h[1]===food[1]){score+=10;food=[Math.random()*N|0,Math.random()*N|0]}else sn.pop()}
setInterval(step,110);
function loop(){x.fillStyle='#0D1524';x.fillRect(0,0,W,H);
x.fillStyle='#E34C4C';x.fillRect(food[0]*S+2,food[1]*S+2,S-4,S-4);
sn.forEach((s,i)=>{x.fillStyle=i?`hsl(212,60%,${68-Math.min(i*2,28)}%)`:'#8FB3E8';x.fillRect(s[0]*S+1,s[1]*S+1,S-2,S-2)});
document.getElementById('tip').textContent=alive?`得分 ${score} · 滑动/方向键控制`:`游戏结束 · 得分 ${score} · 刷新重来`;
requestAnimationFrame(loop)}loop();
</script></body></html>
