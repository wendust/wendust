<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>打地鼠 - wendust 示例</title>
<style>html,body{margin:0;height:100%;background:#0D1524;overflow:hidden;touch-action:none}canvas{display:block}#tip{position:fixed;top:10px;left:0;right:0;text-align:center;color:#8FA0BC;font:13px/1.6 system-ui;pointer-events:none}#back{position:fixed;top:10px;left:10px;color:#8FB3E8;text-decoration:none;font:14px system-ui;background:rgba(13,21,36,.7);padding:8px 14px;border-radius:10px;z-index:9}</style></head>
<body><a id="back" href="../index.html#examples">返回</a><div id="tip"></div>
<script>
let score=0,t=30,playing=true;
document.body.innerHTML+=`<div id=g style="position:fixed;inset:70px 16px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px"></div>`;
const g=document.getElementById('g');
for(let i=0;i<9;i++){const h=document.createElement('div');
h.style.cssText='background:#24324E;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;overflow:hidden;position:relative';
h.onclick=()=>{if(h.querySelector('.m')){score+=10;h.textContent=''}};
g.appendChild(h)}
function pop(){if(!playing)return;
const holes=[...g.children].filter(h=>!h.textContent);
if(holes.length){const h=holes[Math.random()*holes.length|0];
const m=document.createElement('div');m.className='m';m.textContent='●';m.style.cssText='font-size:52px;color:#F0B429';
h.appendChild(m);setTimeout(()=>m.remove(),700+Math.random()*500)}
setTimeout(pop,380+Math.random()*500)}
pop();setInterval(()=>{if(playing&&--t<=0){playing=false;
document.getElementById('tip').textContent=`时间到！得分 ${score} · 刷新重来`}},1000);
document.getElementById('tip').textContent='点击冒出的小球得分';
</script></body></html>
